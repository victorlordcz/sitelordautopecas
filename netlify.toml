# Configuração do Netlify.
# Só é usada quando a publicação está ligada ao GitHub — se você envia a pasta
# "dist" arrastando, o Netlify ignora este arquivo.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Versão do Node usada para montar o site no Netlify.
  # O Astro 7 exige Node >= 22.12. O valor "22" faz o Netlify usar sempre a
  # última 22.x, que atende o requisito e continua recebendo correções.
  NODE_VERSION = "22"

# Os cabeçalhos de segurança e de cache NÃO ficam aqui.
# Eles são gerados em dist/_headers a cada build, por
# scripts/gerar-headers.mjs, porque a Content-Security-Policy precisa do
# hash dos scripts embutidos — um valor que muda junto com o código.
# Para alterar as regras, edite aquele script.
