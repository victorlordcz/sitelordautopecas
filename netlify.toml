# Configuração do Netlify.
# Só é usada quando a publicação está ligada ao GitHub — se você envia a pasta
# "dist" arrastando, o Netlify ignora este arquivo.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Versão do Node usada para montar o site no Netlify.
  NODE_VERSION = "22"

# Os arquivos em /_astro/ têm o conteúdo no próprio nome (ex.: index.DY00.css).
# Quando algo muda, o nome muda junto — então o navegador pode guardar esses
# arquivos para sempre sem risco de mostrar uma versão velha.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A página em si nunca é guardada em cache: assim qualquer alteração
# de texto ou telefone aparece na hora para quem já visitou o site.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
